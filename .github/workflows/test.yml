name: test
permissions:
    contents: read

on:
    push:
    workflow_dispatch:

jobs:
    cargo-test:
        runs-on: ubuntu-latest
        name: test
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
              with:
                  cache-all-crates: true

            # actions-rust-lang/setup-rust-toolchain is Caching for Rust tools and build artifacts is enabled.

            - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
              with:
                  tool: cargo-binstall just cargo-hack cargo-nextest cargo-llvm-cov

            - name: cov test
              run: just cov
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./lcov.info
            - name: Upload test results to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./target/nextest/ci/junit.xml
                  report_type: test_results
