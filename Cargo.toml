[package]
name = "my-http-server"
version = "4.2.9"
edition = "2024"
license-file = "./LICENSE.txt"
readme = "./README.md"
repository = "https://github.com/Paul-16098/my-http-server/"
description = "a server using actix-web, markdown-ppp, and handlebars"
authors = ["Paul-16098"]
rust-version = "1.88.0"

[package.metadata.wix]
upgrade-guid = "5BFF95FD-A231-42D2-A585-62F661AB3D80"
path-guid = "F403F12C-1127-43F7-B427-DA73B1322FF8"
license = true
eula = false

[[bin]]
name = "my-http-server"
path = "src/main.rs"

[dependencies]
actix-files = "0.7.0"
actix-ip-filter = "0.4.0"
actix-web-httpauth = "0.8.2"
clap-completion-flag = "1.1.0"
clap-verbosity-flag = "3.0.4"
config = "0.15.18"
constant_time_eq = "0.6.0"
directories = "6.0.0"
env_logger = "0.11.8"
handlebars = "6.3.2"
log = "0.4.28"
nest_struct = "0.5.5"
nom = "8.0.0"
percent-encoding = "2.3.2"
rustls-pki-types = "1.12.0"
serde = "1.0.228"
serde_json = "1.0.145"
thiserror = "2.0.17"

[dependencies.actix-governor]
version = "0.10.0"
features = ["log"]

[dependencies.actix-web]
version = "4.11.0"
features = ["rustls-0_23"]

[dependencies.clap]
version = "4.5.49"
features = [
  "derive",
  "string",
]

[dependencies.markdown-ppp]
version = "2.7.1"
features = [
  "ast-serde",
  "ast-transform",
]

[dependencies.rustls]
version = "0.23"
default-features = false
features = [
  "logging",
  "ring",
  "std",
  "tls12",
]

[dependencies.ureq]
version = "3.1.4"
features = ["json"]
optional = true

[dependencies.utoipa]
version = "6.0.0"
features = ["actix_extras"]
optional = true

[dependencies.wax]
version = "0.7.0"
features = [
  "miette",
  "walk",
]

[dev-dependencies]
build-fs-tree = "0.8.1"
insta = "1.47.2"
regex = "1.13.1"
simple_test_case = "1.3.0"
tempfile = "3.23.0"

[features]
default = [
  "api",
  "github_emojis",
]
api = ["dep:utoipa"]
github_emojis = ["dep:ureq"]

[lints.clippy]
expect_used = "warn"
unwrap_used = "warn"

[profile.dist]
inherits = "release"
lto = "thin"
